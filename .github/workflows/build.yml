name: Build Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  OPENCV_VERSION: 5.0.0

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        include:

          - os: ubuntu-latest
            artifact: glotrack-linux.tar.gz
            triplet: x64-linux

          - os: macos-latest
            artifact: glotrack-macos.tar.gz
            triplet: arm64-osx

          - os: windows-latest
            artifact: glotrack-windows.zip
            triplet: x64-windows


    runs-on: ${{ matrix.os }}

    steps:

      #
      # Checkout
      #

      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive


      #
      # Dependencies
      #

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ninja-build \
            gcc-14 \
            g++-14 \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev


      - name: Select GCC 14 toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "CC=gcc-14" >> $GITHUB_ENV
          echo "CXX=g++-14" >> $GITHUB_ENV


      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ninja


      - name: Select macOS Clang toolchain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV


      #
      # vcpkg
      #

      - name: Checkout vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg
          fetch-depth: 1


      - name: Bootstrap vcpkg
        shell: bash
        run: |
          ./vcpkg/bootstrap-vcpkg.sh


      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/downloads
            vcpkg/buildtrees
            vcpkg/packages
            vcpkg/installed

          key: |
            vcpkg-${{ runner.os }}-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}


      - name: Install vcpkg dependencies
        shell: bash
        run: |
          ./vcpkg/vcpkg install \
            --triplet ${{ matrix.triplet }}


      #
      # OpenCV
      #

      - name: Cache OpenCV
        id: opencv-cache
        uses: actions/cache@v4
        with:
          path: |
            opencv
            opencv-install

          key: |
            opencv-v2-${{ env.OPENCV_VERSION }}-${{ runner.os }}-${{ matrix.triplet }}

          restore-keys: |
            opencv-v2-${{ env.OPENCV_VERSION }}-${{ runner.os }}-


      - name: Download OpenCV
        shell: bash
        run: |
          if [ ! -d opencv ]; then
            git clone \
              --depth 1 \
              --branch ${{ env.OPENCV_VERSION }} \
              https://github.com/opencv/opencv.git
          fi


      - name: Configure OpenCV (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |

          cmake \
            -S opencv \
            -B opencv-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/opencv-install \
            ${{ runner.os == 'Linux' && '-DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14' || '' }} \
            -DBUILD_TESTS=OFF \
            -DBUILD_PERF_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_opencv_java=OFF \
            -DBUILD_opencv_python3=OFF \
            -DBUILD_opencv_dnn=OFF \
            -DWITH_PROTOBUF=OFF \
            -DWITH_CUDA=OFF


      - name: Configure OpenCV (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |

          cmake \
            -S opencv \
            -B opencv-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/opencv-install \
            -DBUILD_TESTS=OFF \
            -DBUILD_PERF_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_opencv_java=OFF \
            -DBUILD_opencv_python3=OFF \
            -DBUILD_opencv_dnn=OFF \
            -DWITH_PROTOBUF=OFF \
            -DWITH_CUDA=OFF


      - name: Build OpenCV
        shell: bash
        run: |

          cmake --build opencv-build \
            --parallel 2


      - name: Install OpenCV
        shell: bash
        run: |

          cmake --install opencv-build



      #
      # Build glotrack
      #

      - name: Configure project (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DOpenCV_DIR=$GITHUB_WORKSPACE/opencv-install/lib/cmake/opencv5
      
      - name: Configure project (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          OPENCV_DIR=$(find "$GITHUB_WORKSPACE/opencv-install" \
            -name OpenCVConfig.cmake \
            -exec dirname {} \; \
            | head -n 1)

          if [ -z "$OPENCV_DIR" ]; then
            echo "ERROR: OpenCVConfig.cmake not found"
            find "$GITHUB_WORKSPACE/opencv-install" -type f
            exit 1
          fi

          echo "Found OpenCV at: $OPENCV_DIR"

          cmake \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DOpenCV_DIR="$OPENCV_DIR"


      - name: Build project
        shell: bash
        run: |

          cmake --build build \
            --parallel



      - name: Install project
        shell: bash
        run: |

          cmake --install build \
            --prefix package



      #
      # Package
      #

      - name: Package Linux/macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |

          tar -czf ${{ matrix.artifact }} \
            -C package .


      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |

          Compress-Archive \
            -Path package\* \
            -DestinationPath ${{ matrix.artifact }}



      #
      # Upload
      #

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:

          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}



  release:

    needs: build

    runs-on: ubuntu-latest


    steps:

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true


      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:

          draft: true

          files: |
            *.tar.gz
            *.zip